workflows:
  pianomentor-hardware-test:
    name: PianoMentor V1 Hardware Test
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: development/polyphonic-midi
          include: true
          source: true
    integrations:
      app_store_connect: PianoMentor Codemagic 3
    environment:
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: --use-old-altool
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hb411.PianoMentor
      xcode: '27.0'
    scripts:
      - name: Verify Xcode and iOS SDK
        script: |
          set -e
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 27
      - name: Create PianoMentor source
        script: |
          set -e
          mkdir -p PianoMentor
          cat > project.yml <<'YAML'
          name: PianoMentor
          options:
            bundleIdPrefix: com.hb411
            deploymentTarget:
              iOS: "17.0"
          targets:
            PianoMentor:
              type: application
              platform: iOS
              sources: [PianoMentor]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hb411.PianoMentor
                  TARGETED_DEVICE_FAMILY: "2"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
          YAML
          # Use a monotonically increasing Codemagic build number, above the previously uploaded build 1.
          BUILD_VERSION=$(( ${BUILD_NUMBER:?Missing Codemagic BUILD_NUMBER} + 1 ))
          test "$BUILD_VERSION" -gt 1
          sed -i.bak "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_VERSION\"/" project.yml
          rm project.yml.bak
          echo "PianoMentor build number: $BUILD_VERSION"
          mkdir -p PianoMentor/Assets.xcassets/AppIcon.appiconset

          python3 - <<'PY'

          import json, struct, zlib

          from pathlib import Path

          root = Path("PianoMentor/Assets.xcassets")

          folder = root / "AppIcon.appiconset"

          def chunk(tag, data):

              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          def icon(n):

              rows = []

              for y in range(n):

                  row = bytearray([0])

                  for x in range(n):

                      u, v = x / n, y / n

                      color = (25, 35, 55)

                      if 0.15 < u < 0.85 and 0.25 < v < 0.75:

                          k = (u - 0.15) / 0.1

                          color = (245, 245, 245)

                          if k % 1 < 0.045:

                              color = (25, 35, 55)

                          if v < 0.55 and any(abs(k-i) < 0.28 for i in [1,2,4,5,6]):

                              color = (15, 15, 20)

                      row.extend(color)

                  rows.append(bytes(row))

              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", n,n,8,2,0,0,0)) + chunk(b"IDAT", zlib.compress(b"".join(rows))) + chunk(b"IEND", b"")

          images = []

          for size, scale, pixels in [("20x20","1x",20),("20x20","2x",40),("29x29","1x",29),("29x29","2x",58),("40x40","1x",40),("40x40","2x",80),("76x76","1x",76),("76x76","2x",152),("83.5x83.5","2x",167)]:

              name = f"icon-{pixels}.png"

              (folder / name).write_bytes(icon(pixels))

              images.append(dict(idiom="ipad",size=size,scale=scale,filename=name))

          (folder / "icon-1024.png").write_bytes(icon(1024))

          images.append(dict(idiom="ios-marketing",size="1024x1024",scale="1x",filename="icon-1024.png"))

          (folder / "Contents.json").write_text(json.dumps(dict(images=images,info=dict(author="xcode",version=1))))

          (root / "Contents.json").write_text(json.dumps(dict(info=dict(author="xcode",version=1))))
          PY
          cat > PianoMentor/PianoMentorApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct PianoMentorApp: App {
              @StateObject private var midi = MIDIManager()
              var body: some Scene {
                  WindowGroup { ContentView().environmentObject(midi) }
              }
          }
          SWIFT

          cat > PianoMentor/MIDIManager.swift <<'SWIFT'
          import Foundation
          import CoreMIDI
          import Combine
          import AVFoundation
          import AudioToolbox

          final class MIDIManager: ObservableObject {
              @Published var activeNotes: Set<Int> = []
              private var held: [UInt32: Int] = [:]
              @Published var lastNote: Int? = nil
              @Published var lastVelocity: Int = 0
              @Published var sources: [String] = []
              @Published var destinations: [String] = []
              @Published var status = "Looking for MIDI…"

              private var client = MIDIClientRef()
              private var inputPort = MIDIPortRef()
              private var outputPort = MIDIPortRef()

              private var interruptionObserver: NSObjectProtocol?
              init() {
                  setup()
                  interruptionObserver = NotificationCenter.default.addObserver(
                      forName: AVAudioSession.interruptionNotification, object: nil, queue: .main
                  ) { [weak self] notification in
                      guard let raw = notification.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt,
                            AVAudioSession.InterruptionType(rawValue: raw) == .began else { return }
                      self?.stopPlayback()
                  }
              }
              deinit {
                  if let interruptionObserver { NotificationCenter.default.removeObserver(interruptionObserver) }
              }

              func refresh() { scanAndConnect() }

              private func setup() {
                  MIDIClientCreateWithBlock("PianoMentor" as CFString, &client) { [weak self] _ in
                      DispatchQueue.main.async { self?.scanAndConnect() }
                  }
                  MIDIInputPortCreate(client, "PianoMentor Input" as CFString, { packetList, readProcRefCon, _ in
                      guard let readProcRefCon else { return }
                      let manager = Unmanaged<MIDIManager>.fromOpaque(readProcRefCon).takeUnretainedValue()
                      manager.handle(packetList)
                  }, Unmanaged.passUnretained(self).toOpaque(), &inputPort)
                  MIDIOutputPortCreate(client, "PianoMentor Output" as CFString, &outputPort)
                  scanAndConnect()
              }

              private func scanAndConnect() {
                  for i in 0..<MIDIGetNumberOfSources() {
                      let endpoint = MIDIGetSource(i)
                      MIDIPortDisconnectSource(inputPort, endpoint)
                      MIDIPortConnectSource(inputPort, endpoint, nil)
                  }
                  var s: [String] = []
                  for i in 0..<MIDIGetNumberOfSources() {
                      let endpoint = MIDIGetSource(i)
                      s.append(name(endpoint))
                      MIDIPortConnectSource(inputPort, endpoint, nil)
                  }
                  var d: [String] = []
                  for i in 0..<MIDIGetNumberOfDestinations() { d.append(name(MIDIGetDestination(i))) }
                  DispatchQueue.main.async {
                      self.sources = s; self.destinations = d
                      self.destinationIDs = (0..<MIDIGetNumberOfDestinations()).map { MIDIGetDestination($0) }
                      if let selected = self.selectedDestination, !self.destinationIDs.contains(selected) {
                          self.stopPlayback()
                          self.selectedDestination = nil
                      }
                      self.status = (s.isEmpty && d.isEmpty) ? "No MIDI device detected" : "MIDI connected"
                  }
              }

              private func name(_ object: MIDIObjectRef) -> String {
                  var value: Unmanaged<CFString>?
                  MIDIObjectGetStringProperty(object, kMIDIPropertyDisplayName, &value)
                  return value?.takeRetainedValue() as String? ?? "MIDI Device"
              }

              private func handle(_ packetList: UnsafePointer<MIDIPacketList>) {
                  var events: [(UInt32, Int, Int, Bool)] = []
                  guard let packetOffset = MemoryLayout<MIDIPacketList>.offset(of: \.packet),
                        let dataOffset = MemoryLayout<MIDIPacket>.offset(of: \.data) else { return }
                  var packet = UnsafeRawPointer(packetList).advanced(by: packetOffset).assumingMemoryBound(to: MIDIPacket.self)

                  for _ in 0..<packetList.pointee.numPackets {
                      let data = UnsafeRawPointer(packet).advanced(by: dataOffset).assumingMemoryBound(to: UInt8.self)
                      let bytes = Array(UnsafeBufferPointer(start: data, count: Int(packet.pointee.length)))
                      var i = 0
                      var runningStatus: UInt8 = 0

                      while i < bytes.count {
                          var status = bytes[i]
                          if status & 0x80 != 0 {
                              runningStatus = status
                              i += 1
                          } else {
                              guard runningStatus != 0 else { i += 1; continue }
                              status = runningStatus
                          }

                          let kind = status & 0xF0
                          if kind == 0x90 || kind == 0x80 {
                              guard i + 1 < bytes.count else { break }
                              let note = Int(bytes[i])
                              let velocity = Int(bytes[i + 1])
                              let channel = UInt32(status & 0x0F)
                              let key = (channel << 8) | UInt32(note)
                              events.append((key, note, velocity, kind == 0x90 && velocity > 0))
                              i += 2
                          } else if kind == 0xC0 || kind == 0xD0 {
                              i += 1
                          } else if status >= 0xF0 {
                              // System messages are irrelevant to keyboard note tracking.
                              // Stop parsing this packet rather than risk treating payload bytes as notes.
                              break
                          } else {
                              i += 2
                          }
                      }
                      packet = UnsafePointer(MIDIPacketNext(UnsafeMutablePointer(mutating: packet)))
                  }

                  guard !events.isEmpty else { return }
                  DispatchQueue.main.async {
                      for (key, note, velocity, on) in events {
                          if on {
                              self.held[key] = note
                              self.lastNote = note
                              self.lastVelocity = velocity
                          } else {
                              self.held.removeValue(forKey: key)
                          }
                      }
                      self.activeNotes = Set(self.held.values)
                      if let last = self.lastNote, !self.activeNotes.contains(last) {
                          self.lastNote = self.activeNotes.max()
                      }
                      self.status = "MIDI input · \(self.activeNotes.count) held"
                  }
              }

              @Published var selectedDestination: MIDIEndpointRef? = nil
              @Published var destinationIDs: [MIDIEndpointRef] = []
              func selectDestination(_ endpoint: MIDIEndpointRef?) {
                  stopPlayback()
                  selectedDestination = endpoint
              }
              @Published var localAudio = false
              @Published var instrument = 0
              @Published var volume: Float = 0.8
              private let engine = AVAudioEngine()
              private let sampler = AVAudioUnitSampler()
              private var audioReady = false
              private var touchNotes: Set<UInt8> = []
              private var touchDestination: MIDIEndpointRef?
              private var touchUsesLocal = false
              func touchOn(_ note: UInt8) {
                  guard !touchNotes.contains(note) else { return }
                  if isPlaying { stopPlayback() }
                  if touchNotes.isEmpty { touchUsesLocal = localAudio }
                  if touchUsesLocal {
                      do { try configureAudio() } catch { status = error.localizedDescription; return }
                      sampler.startNote(note, withVelocity: 85, onChannel: 0)
                  } else {
                      guard MIDIGetNumberOfDestinations() > 0 else { status = "Select internal audio in Settings"; return }
                      let dest = touchDestination ?? selectedDestination ?? MIDIGetDestination(0)
                      touchDestination = dest
                      send(status: 0x90, note: note, velocity: 85, to: dest)
                  }
                  touchNotes.insert(note)
                  playbackNotes = Set(touchNotes.map(Int.init))
              }
              func touchOff(_ note: UInt8) {
                  guard touchNotes.remove(note) != nil else { return }
                  if touchUsesLocal { sampler.stopNote(note, onChannel: 0) }
                  else if let dest = touchDestination { send(status: 0x80, note: note, velocity: 0, to: dest) }
                  if touchNotes.isEmpty { touchDestination = nil }
                  playbackNotes = Set(touchNotes.map(Int.init))
              }

              func configureAudio() throws {
                  if !audioReady {
                      engine.attach(sampler)
                      engine.connect(sampler, to: engine.mainMixerNode, format: nil)
                      audioReady = true
                  }
                  try AVAudioSession.sharedInstance().setCategory(.playback)
                  try AVAudioSession.sharedInstance().setActive(true)
                  if !engine.isRunning { try engine.start() }
                  engine.mainMixerNode.outputVolume = volume
              }

              func setVolume(_ value: Float) {
                  volume = min(1, max(0, value))
                  if audioReady { engine.mainMixerNode.outputVolume = volume }
              }

              func setLocalAudio(_ enabled: Bool) {
                  stopPlayback()
                  localAudio = enabled
              }

              @Published var songTempo = 1.0
              func playSong(_ url: URL) {
                  stopPlayback()
                  let local = localAudio
                  let dest = selectedDestination ?? MIDIGetDestination(0)
                  if local {
                      do { try configureAudio() } catch { status = error.localizedDescription; return }
                  } else {
                      guard MIDIGetNumberOfDestinations() > 0, destinationIDs.contains(dest) else { status = "MIDI destination unavailable"; return }
                  }
                  var sequence: MusicSequence?
                  guard NewMusicSequence(&sequence) == noErr, let sequence else { status = "Cannot create MIDI sequence"; return }
                  guard MusicSequenceFileLoad(sequence, url as CFURL, .midiType, []) == noErr else {
                      DisposeMusicSequence(sequence); status = "Cannot read MIDI song"; return
                  }
                  var count: UInt32 = 0
                  MusicSequenceGetTrackCount(sequence, &count)
                  var events: [(Double, UInt8, UInt8, UInt8)] = []
                  for index in 0..<count {
                      var track: MusicTrack?
                      guard MusicSequenceGetIndTrack(sequence, index, &track) == noErr, let track else { continue }
                      var iterator: MusicEventIterator?
                      guard NewMusicEventIterator(track, &iterator) == noErr, let iterator else { continue }
                      defer { DisposeMusicEventIterator(iterator) }
                      var hasEvent: DarwinBoolean = false
                      MusicEventIteratorHasCurrentEvent(iterator, &hasEvent)
                      while hasEvent.boolValue {
                          var beat: MusicTimeStamp = 0
                          var type: MusicEventType = 0
                          var data: UnsafeRawPointer?
                          var size: UInt32 = 0
                          MusicEventIteratorGetEventInfo(iterator, &beat, &type, &data, &size)
                          if type == kMusicEventType_MIDINoteMessage, let data, size >= UInt32(MemoryLayout<MIDINoteMessage>.size) {
                              let n = data.load(as: MIDINoteMessage.self)
                              var start: Float64 = 0, end: Float64 = 0
                              if n.channel != 9, n.note <= 127, n.velocity > 0, n.duration > 0, MusicSequenceGetSecondsForBeats(sequence, beat, &start) == noErr,
                                 MusicSequenceGetSecondsForBeats(sequence, beat + Double(n.duration), &end) == noErr,
                                 start.isFinite, end.isFinite, start >= 0, end >= start {
                                  events.append((start, n.note, n.velocity, (0x90 | n.channel)))
                                  events.append((end, n.note, 0, (0x80 | n.channel)))
                              }
                          }
                          if type == kMusicEventType_MIDIChannelMessage, let data, size >= UInt32(MemoryLayout<MIDIChannelMessage>.size) {
                              let message = data.load(as: MIDIChannelMessage.self)
                              var seconds: Float64 = 0
                              if message.status & 0xF0 == 0xB0, message.status & 0x0F != 9, message.data1 == 64,
                                 MusicSequenceGetSecondsForBeats(sequence, beat, &seconds) == noErr, seconds.isFinite, seconds >= 0 {
                                  events.append((seconds, 64, min(message.data2, 127), message.status))
                              }
                          }
                          MusicEventIteratorNextEvent(iterator)
                          MusicEventIteratorHasCurrentEvent(iterator, &hasEvent)
                      }
                  }
                  DisposeMusicSequence(sequence)
                  guard events.contains(where: { $0.3 & 0xF0 == 0x90 }) else { status = "No playable MIDI notes"; return }
                  // Preserve source order within each event class at equal timestamps.
                  // Release notes before retriggering; apply pedal changes first.
                  func eventPriority(_ status: UInt8) -> Int {
                      switch status & 0xF0 {
                      case 0xB0: return 0
                      case 0x80: return 1
                      default: return 2
                      }
                  }
                  events = events.enumerated().sorted { lhs, rhs in
                      if lhs.element.0 != rhs.element.0 { return lhs.element.0 < rhs.element.0 }
                      let lp = eventPriority(lhs.element.3), rp = eventPriority(rhs.element.3)
                      return lp == rp ? lhs.offset < rhs.offset : lp < rp
                  }.map { $0.element }
                  let speed = min(2.0, max(0.25, songTempo))
                  let timeline = events.map { ($0.0 / speed, $0.1, $0.2, $0.3) }
                  playbackUsesLocal = local
                  if !local { playbackDestination = dest }
                  let generation = playbackGeneration
                  let origin = ProcessInfo.processInfo.systemUptime
                  var counts: [UInt16: Int] = [:]
                  isPlaying = true
                  func advance(_ index: Int) {
                      guard generation == self.playbackGeneration else { return }
                      var i = index
                      let elapsed = ProcessInfo.processInfo.systemUptime - origin
                      while i < timeline.count && timeline[i].0 <= elapsed + 0.002 {
                          let (_, note, velocity, statusByte) = timeline[i]
                          let channel = statusByte & 0x0F
                          let command = statusByte & 0xF0
                          let key = UInt16(channel) << 8 | UInt16(note)
                          self.songChannels.insert(channel)
                          if command == 0xB0 {
                              if local { self.sampler.sendController(64, withValue: velocity, onChannel: channel) }
                              else { self.send(status: statusByte, note: 64, velocity: velocity, to: dest) }
                          } else if command == 0x90 {
                              counts[key, default: 0] += 1
                              self.sounding.insert(note)
                              self.songSounding.insert(key)
                              if counts[key] == 1 {
                                  if local { self.sampler.startNote(note, withVelocity: velocity, onChannel: channel) }
                                  else { self.send(status: statusByte, note: note, velocity: velocity, to: dest) }
                              }
                          } else if let count = counts[key] {
                              if count <= 1 {
                                  counts.removeValue(forKey: key)
                                  self.songSounding.remove(key)
                                  if !counts.keys.contains(where: { UInt8($0 & 0xFF) == note }) { self.sounding.remove(note) }
                                  if local { self.sampler.stopNote(note, onChannel: channel) }
                                  else { self.send(status: statusByte, note: note, velocity: 0, to: dest) }
                              } else { counts[key] = count - 1 }
                          }
                          i += 1
                      }
                      self.playbackNotes = Set(self.sounding.map(Int.init))
                      if i == timeline.count { self.stopPlayback(); return }
                      let next = i
                      DispatchQueue.main.asyncAfter(deadline: .now() + max(0, timeline[next].0 - (ProcessInfo.processInfo.systemUptime - origin))) { advance(next) }
                  }
                  advance(0)
              }
              private var songChannels: Set<UInt8> = []
              private var songSounding: Set<UInt16> = []
              private var playbackGeneration = 0
              private var sounding: Set<UInt8> = []
              private var playbackDestination: MIDIEndpointRef?
              private var playbackUsesLocal = false
              @Published var visualDelay = 0.35
              @Published var isPlaying = false
              @Published var playbackNotes: Set<Int> = []
              @Published var lastPlaybackNotes: Set<Int> = []

              func stopPlayback() {
                  for note in Array(touchNotes) { touchOff(note) }
                  playbackGeneration += 1
                  for key in songSounding {
                      let channel = UInt8(key >> 8), note = UInt8(key & 0xFF)
                      if playbackUsesLocal { sampler.stopNote(note, onChannel: channel) }
                      else if let dest = playbackDestination { send(status: 0x80 | channel, note: note, velocity: 0, to: dest) }
                  }
                  for channel in songChannels {
                      for controller: UInt8 in [64, 123] {
                          if playbackUsesLocal { sampler.sendController(controller, withValue: 0, onChannel: channel) }
                          else if let dest = playbackDestination { send(status: 0xB0 | channel, note: controller, velocity: 0, to: dest) }
                      }
                  }
                  if !songChannels.isEmpty { sounding.removeAll() }
                  songChannels.removeAll()
                  songSounding.removeAll()
                  if let dest = playbackDestination {
                      for note in sounding { send(status: 0x80, note: note, velocity: 0, to: dest) }
                      send(status: 0xB0, note: 64, velocity: 0, to: dest)
                      send(status: 0xB0, note: 123, velocity: 0, to: dest)
                  }
                  if playbackUsesLocal {
                      for note in sounding { sampler.stopNote(note, onChannel: 0) }
                      sampler.sendController(64, withValue: 0, onChannel: 0)
                      sampler.sendController(123, withValue: 0, onChannel: 0)
                  }
                  sounding.removeAll()
                  playbackNotes = []
                  lastPlaybackNotes = []
                  playbackDestination = nil
                  playbackUsesLocal = false
                  isPlaying = false
              }

              func playC4() { playSequence([[60]]) }
              func playChord() { playSequence([[60, 64, 67]]) }
              func playPassage() { playSequence([[60], [64], [67], [72], [67], [64], [60]], duration: 0.35) }

              func playSequence(_ steps: [[UInt8]], duration: Double = 0.7) {
                  stopPlayback()
                  let local = localAudio
                  let dest = selectedDestination ?? MIDIGetDestination(0)
                  if local {
                      do { try configureAudio() }
                      catch { status = "Audio unavailable: \(error.localizedDescription)"; return }
                  } else {
                      guard MIDIGetNumberOfDestinations() > 0, destinationIDs.contains(dest) else { status = "MIDI destination unavailable"; return }
                      playbackDestination = dest
                  }
                  playbackUsesLocal = local
                  isPlaying = true
                  let generation = playbackGeneration
                  let delay = local ? 0 : visualDelay
                  func advance(_ index: Int) {
                      guard generation == self.playbackGeneration else { return }
                      guard index < steps.count else { self.stopPlayback(); return }
                      self.sounding = Set(steps[index])
                      let visualNotes = Set(steps[index].map(Int.init))
                      for note in self.sounding {
                          if local { self.sampler.startNote(note, withVelocity: 75, onChannel: 0) }
                          else { self.send(status: 0x90, note: note, velocity: 75, to: dest) }
                      }
                      DispatchQueue.main.asyncAfter(deadline: .now() + delay) { [weak self] in
                          guard let self, generation == self.playbackGeneration else { return }
                          self.playbackNotes = visualNotes
                          self.lastPlaybackNotes = visualNotes
                      }
                      DispatchQueue.main.asyncAfter(deadline: .now() + duration) { [weak self] in
                          guard let self, generation == self.playbackGeneration else { return }
                          for note in self.sounding {
                              if local { self.sampler.stopNote(note, onChannel: 0) }
                              else { self.send(status: 0x80, note: note, velocity: 0, to: dest) }
                          }
                          self.sounding.removeAll()
                          // Keep the just-played notes visible through the Disklavier's mechanical release.
                          // The next step replaces them; the final step remains as a playback result until
                          // the user plays the Yamaha or starts another playback.
                          if index + 1 < steps.count {
                              advance(index + 1)
                          } else {
                              self.playbackDestination = nil
                              DispatchQueue.main.asyncAfter(deadline: .now() + delay) { [weak self] in
                                  guard let self, generation == self.playbackGeneration else { return }
                                  self.playbackNotes = []
                                  self.lastPlaybackNotes = []
                                  self.isPlaying = false
                              }
                          }
                      }
                  }
                  advance(0)
              }

              private func send(status: UInt8, note: UInt8, velocity: UInt8, to dest: MIDIEndpointRef) {
                  var list = MIDIEventList()
                  let packet = MIDIEventListInit(&list, ._1_0)
                  var words = [0x20000000 | UInt32(status) << 16 | UInt32(note) << 8 | UInt32(velocity)]
                  words.withUnsafeBufferPointer { ptr in
                      _ = MIDIEventListAdd(&list, MemoryLayout<MIDIEventList>.size, packet, 0, 1, ptr.baseAddress!)
                  }
                  let result = MIDISendEventList(outputPort, dest, &list)
                  if status & 0xF0 == 0x90 {
                      self.status = "MIDI send: \(result) · \(self.name(dest))"
                  }
              }
          }
          SWIFT

          cat > PianoMentor/ContentView.swift <<'SWIFT'
          import SwiftUI
          import CoreMIDI
          import UniformTypeIdentifiers
          import UIKit

          struct ContentView: View {
              @EnvironmentObject var midi: MIDIManager
              @AppStorage("chordOctave") private var chordOctave = 4
              @AppStorage("appearanceMode") private var appearanceMode = 0
              @AppStorage("keyHighlight") private var keyHighlight = 0
              @State private var settings = false
              @State private var musicLibrary = false
              @State private var importingMIDI = false
              @State private var importedSongs: [URL] = []
              @State private var importError = ""
              private var musicFolder: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("MIDI Library", isDirectory: true)
              }
              private func refreshSongs() {
                  importedSongs = ((try? FileManager.default.contentsOfDirectory(at: musicFolder, includingPropertiesForKeys: nil)) ?? []).filter { ["mid", "midi"].contains($0.pathExtension.lowercased()) }.sorted { $0.lastPathComponent < $1.lastPathComponent }
              }
              private func importSong(_ url: URL) throws {
                  let access = url.startAccessingSecurityScopedResource()
                  defer { if access { url.stopAccessingSecurityScopedResource() } }
                  let data = try Data(contentsOf: url)
                  guard data.count >= 14, data.prefix(4) == Data([77,84,104,100]) else {
                      throw NSError(domain: "PianoMentor", code: 1, userInfo: [NSLocalizedDescriptionKey: "Not a standard MIDI file"])
                  }
                  try FileManager.default.createDirectory(at: musicFolder, withIntermediateDirectories: true)
                  var target = musicFolder.appendingPathComponent(url.lastPathComponent)
                  if FileManager.default.fileExists(atPath: target.path) {
                      target = musicFolder.appendingPathComponent(UUID().uuidString + "-" + url.lastPathComponent)
                  }
                  try data.write(to: target, options: .atomic)
                  refreshSongs()
              }
              @State private var songSearch = ""
              @AppStorage("favoriteMIDIFiles") private var favoriteMIDIFiles = "[]"
              @State private var favoritesOnly = false
              private var favoriteNames: Set<String> {
                  Set((try? JSONDecoder().decode([String].self, from: Data(favoriteMIDIFiles.utf8))) ?? [])
              }
              private func toggleFavorite(_ song: URL) {
                  var names = favoriteNames
                  if names.contains(song.lastPathComponent) { names.remove(song.lastPathComponent) }
                  else { names.insert(song.lastPathComponent) }
                  if let data = try? JSONEncoder().encode(names.sorted()), let value = String(data: data, encoding: .utf8) { favoriteMIDIFiles = value }
              }
