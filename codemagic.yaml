              private func chordName(_ notes: Set<Int>) -> String? {
                  guard notes.count >= 3 else { return nil }
                  let pcs = Set(notes.map { $0 % 12 })
                  let names = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"]
                  let patterns: [(Set<Int>, String)] = [
                      ([0,4,7], "major"), ([0,3,7], "minor"),
                      ([0,3,6], "diminished"), ([0,4,8], "augmented"),
                      ([0,5,7], "sus4"), ([0,2,7], "sus2"),
                      ([0,4,7,10], "7"), ([0,4,7,11], "maj7"),
                      ([0,3,7,10], "m7"),
                      ([0,4,7,11,2], "maj9"), ([0,4,7,11,2,5], "maj11"),
                      ([0,4,7,11,2,5,9], "maj13"), ([0,4,7,10,2], "9"),
                      ([0,4,7,10,2,5], "11"), ([0,4,7,10,2,5,9], "13"),
                      ([0,3,7,10,2], "m9"), ([0,3,7,10,2,5], "m11"),
                      ([0,3,7,10,2,5,9], "m13"), ([0,3,6,9], "dim7"),
                      ([0,3,6,10], "m7♭5"), ([0,4,7,2], "add9")
                  ]
                  let bass = (notes.min() ?? 0) % 12
                  let roots = [bass] + (0..<12).filter { $0 != bass }
                  var matches: [String] = []
                  for root in roots {
                      let relative = Set(pcs.map { ($0 - root + 12) % 12 })
                      for (pattern, quality) in patterns where relative == pattern {
                          let suffix = quality == "major" ? " major" : quality == "minor" ? " minor" : quality
                          let inversion = root == bass ? "" : "/" + names[bass]
                          matches.append(names[root] + suffix + inversion)
                      }
                  }
                  if !matches.isEmpty { return matches.joined(separator: " · ") }
                  return nil
              }

              private func noteName(_ n: Int?) -> String {
                  guard let n else { return "—" }
                  let names = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"]
                  return "\(names[n % 12])\(n / 12 - 1)"
              }
          }

          struct PianoTouchSurface: UIViewRepresentable {
              let whites: [Int]
              let blackNotes: [Int]
              let down: (Int) -> Void
              let up: (Int) -> Void
              func makeUIView(context: Context) -> Surface {
                  let v = Surface()
                  v.isMultipleTouchEnabled = true
                  v.backgroundColor = .clear
                  return v
              }
              func updateUIView(_ v: Surface, context: Context) {
                  if v.whites != whites { v.releaseAll() }
                  v.whites = whites; v.blackNotes = blackNotes
                  v.down = down; v.up = up
              }
              static func dismantleUIView(_ v: Surface, coordinator: ()) { v.releaseAll() }
              final class Surface: UIView {
                  var whites: [Int] = []
                  var blackNotes: [Int] = []
                  var down: ((Int) -> Void)?
                  var up: ((Int) -> Void)?
                  var held: [ObjectIdentifier: Int] = [:]
                  func note(at p: CGPoint) -> Int? {
                      guard !whites.isEmpty, bounds.width > 0, bounds.contains(p) else { return nil }
                      let w = bounds.width / CGFloat(whites.count)
                      if p.y < bounds.height * 0.62 {
                          for n in blackNotes {
                              if let i = whites.lastIndex(where: { $0 < n }), abs(p.x - CGFloat(i + 1) * w) <= w * 0.31 { return n }
                          }
                      }
                      return whites[min(whites.count - 1, max(0, Int(p.x / w)))]
                  }
                  func release(_ t: UITouch) {
                      if let n = held.removeValue(forKey: ObjectIdentifier(t)), !held.values.contains(n) { up?(n) }
                  }
                  func move(_ t: UITouch) {
                      let id = ObjectIdentifier(t)
                      let n = note(at: t.location(in: self))
                      if held[id] == n { return }
                      release(t)
                      if let n {
                          let already = held.values.contains(n)
                          held[id] = n
                          if !already { down?(n) }
                      }
                  }
                  func releaseAll() {
                      let notes = Set(held.values); held.removeAll()
                      for n in notes { up?(n) }
                  }
                  override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) { for t in touches { move(t) } }
                  override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) { for t in touches { move(t) } }
                  override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) { for t in touches { release(t) } }
                  override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) { for t in touches { release(t) } }
              }
          }

