workflows:
  pianomentor-hardware-test:
    name: PianoMentor V1 Hardware Test
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: development/polyphonic-midi
          include: true
          source: true
    integrations:
      app_store_connect: PianoMentor Codemagic 3
    environment:
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: --use-old-altool
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hb411.PianoMentor
      xcode: '27.0'
    scripts:
      - name: Verify Xcode and iOS SDK
        script: |
          set -e
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 27
      - name: Create PianoMentor source
        script: |
          set -e
          mkdir -p PianoMentor
          cat > project.yml <<'YAML'
          name: PianoMentor
          options:
            bundleIdPrefix: com.hb411
            deploymentTarget:
              iOS: "17.0"
          targets:
            PianoMentor:
              type: application
              platform: iOS
              sources: [PianoMentor]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hb411.PianoMentor
                  TARGETED_DEVICE_FAMILY: "2"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
          YAML
          # Use a monotonically increasing Codemagic build number, above the previously uploaded build 1.
          BUILD_VERSION=$(( ${BUILD_NUMBER:?Missing Codemagic BUILD_NUMBER} + 1 ))
          test "$BUILD_VERSION" -gt 1
          sed -i.bak "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_VERSION\"/" project.yml
          rm project.yml.bak
          echo "PianoMentor build number: $BUILD_VERSION"
          mkdir -p PianoMentor/Assets.xcassets/AppIcon.appiconset

          python3 - <<'PY'

          import json, struct, zlib

          from pathlib import Path

          root = Path("PianoMentor/Assets.xcassets")

          folder = root / "AppIcon.appiconset"

          def chunk(tag, data):

              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          def icon(n):

              rows = []

              for y in range(n):

                  row = bytearray([0])

                  for x in range(n):

                      u, v = x / n, y / n

                      color = (25, 35, 55)

                      if 0.15 < u < 0.85 and 0.25 < v < 0.75:

                          k = (u - 0.15) / 0.1

                          color = (245, 245, 245)

                          if k % 1 < 0.045:

                              color = (25, 35, 55)

                          if v < 0.55 and any(abs(k-i) < 0.28 for i in [1,2,4,5,6]):

                              color = (15, 15, 20)

                      row.extend(color)

                  rows.append(bytes(row))

              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", n,n,8,2,0,0,0)) + chunk(b"IDAT", zlib.compress(b"".join(rows))) + chunk(b"IEND", b"")

          images = []

          for size, scale, pixels in [("20x20","1x",20),("20x20","2x",40),("29x29","1x",29),("29x29","2x",58),("40x40","1x",40),("40x40","2x",80),("76x76","1x",76),("76x76","2x",152),("83.5x83.5","2x",167)]:

              name = f"icon-{pixels}.png"

              (folder / name).write_bytes(icon(pixels))

              images.append(dict(idiom="ipad",size=size,scale=scale,filename=name))

          (folder / "icon-1024.png").write_bytes(icon(1024))

          images.append(dict(idiom="ios-marketing",size="1024x1024",scale="1x",filename="icon-1024.png"))

          (folder / "Contents.json").write_text(json.dumps(dict(images=images,info=dict(author="xcode",version=1))))

          (root / "Contents.json").write_text(json.dumps(dict(info=dict(author="xcode",version=1))))
          PY
          cat > PianoMentor/PianoMentorApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct PianoMentorApp: App {
              @StateObject private var midi = MIDIManager()
              var body: some Scene {
                  WindowGroup { ContentView().environmentObject(midi) }
              }
          }
          SWIFT

          cat > PianoMentor/MIDIManager.swift <<'SWIFT'
          import Foundation
          import CoreMIDI
          import Combine
          import AVFoundation
          import AudioToolbox

          final class MIDIManager: ObservableObject {
              @Published var activeNotes: Set<Int> = []
              private var held: [UInt32: Int] = [:]
              @Published var lastNote: Int? = nil
              @Published var lastVelocity: Int = 0
              @Published var sources: [String] = []
              @Published var destinations: [String] = []
              @Published var status = "Looking for MIDI…"

              private var client = MIDIClientRef()
              private var inputPort = MIDIPortRef()
              private var outputPort = MIDIPortRef()

              init() { setup() }

              func refresh() { scanAndConnect() }

              private func setup() {
                  MIDIClientCreateWithBlock("PianoMentor" as CFString, &client) { [weak self] _ in
                      DispatchQueue.main.async { self?.scanAndConnect() }
                  }
                  MIDIInputPortCreate(client, "PianoMentor Input" as CFString, { packetList, readProcRefCon, _ in
                      guard let readProcRefCon else { return }
                      let manager = Unmanaged<MIDIManager>.fromOpaque(readProcRefCon).takeUnretainedValue()
                      manager.handle(packetList)
                  }, Unmanaged.passUnretained(self).toOpaque(), &inputPort)
                  MIDIOutputPortCreate(client, "PianoMentor Output" as CFString, &outputPort)
                  scanAndConnect()
              }

              private func scanAndConnect() {
                  for i in 0..<MIDIGetNumberOfSources() {
                      let endpoint = MIDIGetSource(i)
                      MIDIPortDisconnectSource(inputPort, endpoint)
                      MIDIPortConnectSource(inputPort, endpoint, nil)
                  }
                  var s: [String] = []
                  for i in 0..<MIDIGetNumberOfSources() {
                      let endpoint = MIDIGetSource(i)
                      s.append(name(endpoint))
                      MIDIPortConnectSource(inputPort, endpoint, nil)
                  }
                  var d: [String] = []
                  for i in 0..<MIDIGetNumberOfDestinations() { d.append(name(MIDIGetDestination(i))) }
                  DispatchQueue.main.async {
                      self.sources = s; self.destinations = d
                      self.destinationIDs = (0..<MIDIGetNumberOfDestinations()).map { MIDIGetDestination($0) }
                      if let selected = self.selectedDestination, !self.destinationIDs.contains(selected) {
                          self.stopPlayback()
                          self.selectedDestination = nil
                      }
                      self.status = (s.isEmpty && d.isEmpty) ? "No MIDI device detected" : "MIDI connected"
                  }
              }

              private func name(_ object: MIDIObjectRef) -> String {
                  var value: Unmanaged<CFString>?
                  MIDIObjectGetStringProperty(object, kMIDIPropertyDisplayName, &value)
                  return value?.takeRetainedValue() as String? ?? "MIDI Device"
              }

              private func handle(_ packetList: UnsafePointer<MIDIPacketList>) {
                  var events: [(UInt32, Int, Int, Bool)] = []
                  guard let packetOffset = MemoryLayout<MIDIPacketList>.offset(of: \.packet),
                        let dataOffset = MemoryLayout<MIDIPacket>.offset(of: \.data) else { return }
                  var packet = UnsafeRawPointer(packetList).advanced(by: packetOffset).assumingMemoryBound(to: MIDIPacket.self)

                  for _ in 0..<packetList.pointee.numPackets {
                      let data = UnsafeRawPointer(packet).advanced(by: dataOffset).assumingMemoryBound(to: UInt8.self)
                      let bytes = Array(UnsafeBufferPointer(start: data, count: Int(packet.pointee.length)))
                      var i = 0
                      var runningStatus: UInt8 = 0

                      while i < bytes.count {
                          var status = bytes[i]
                          if status & 0x80 != 0 {
                              runningStatus = status
                              i += 1
                          } else {
                              guard runningStatus != 0 else { i += 1; continue }
                              status = runningStatus
                          }

                          let kind = status & 0xF0
                          if kind == 0x90 || kind == 0x80 {
                              guard i + 1 < bytes.count else { break }
                              let note = Int(bytes[i])
                              let velocity = Int(bytes[i + 1])
                              let channel = UInt32(status & 0x0F)
                              let key = (channel << 8) | UInt32(note)
                              events.append((key, note, velocity, kind == 0x90 && velocity > 0))
                              i += 2
                          } else if kind == 0xC0 || kind == 0xD0 {
                              i += 1
                          } else if status >= 0xF0 {
                              // System messages are irrelevant to keyboard note tracking.
                              // Stop parsing this packet rather than risk treating payload bytes as notes.
                              break
                          } else {
                              i += 2
                          }
                      }
                      packet = UnsafePointer(MIDIPacketNext(UnsafeMutablePointer(mutating: packet)))
                  }

                  guard !events.isEmpty else { return }
                  DispatchQueue.main.async {
                      for (key, note, velocity, on) in events {
                          if on {
                              self.held[key] = note
                              self.lastNote = note
                              self.lastVelocity = velocity
                          } else {
                              self.held.removeValue(forKey: key)
                          }
                      }
                      self.activeNotes = Set(self.held.values)
                      if let last = self.lastNote, !self.activeNotes.contains(last) {
                          self.lastNote = self.activeNotes.max()
                      }
                      self.status = "MIDI input · \(self.activeNotes.count) held"
                  }
              }

              @Published var selectedDestination: MIDIEndpointRef? = nil
              @Published var destinationIDs: [MIDIEndpointRef] = []
              func selectDestination(_ endpoint: MIDIEndpointRef?) {
                  stopPlayback()
                  selectedDestination = endpoint
              }
              @Published var localAudio = false
              @Published var instrument = 0
              @Published var volume: Float = 0.8
              private let engine = AVAudioEngine()
              private let sampler = AVAudioUnitSampler()
              private var audioReady = false

              func configureAudio() throws {
                  if !audioReady {
                      engine.attach(sampler)
                      engine.connect(sampler, to: engine.mainMixerNode, format: nil)
                      audioReady = true
                  }
                  try AVAudioSession.sharedInstance().setCategory(.playback)
                  try AVAudioSession.sharedInstance().setActive(true)
                  if !engine.isRunning { try engine.start() }
                  engine.mainMixerNode.outputVolume = volume
              }

              func setLocalAudio(_ enabled: Bool) {
                  stopPlayback()
                  localAudio = enabled
              }

              private var playbackGeneration = 0
              private var sounding: Set<UInt8> = []
              private var playbackDestination: MIDIEndpointRef?
              @Published var visualDelay = 0.35
              @Published var isPlaying = false
              @Published var playbackNotes: Set<Int> = []
              @Published var lastPlaybackNotes: Set<Int> = []

              func stopPlayback() {
                  playbackGeneration += 1
                  if let dest = playbackDestination {
                      for note in sounding { send(status: 0x80, note: note, velocity: 0, to: dest) }
                  }
                  if localAudio {
                      for note in sounding { sampler.stopNote(note, onChannel: 0) }
                      sampler.sendController(64, withValue: 0, onChannel: 0)
                      sampler.sendController(123, withValue: 0, onChannel: 0)
                  }
                  sounding.removeAll()
                  playbackNotes = []
                  lastPlaybackNotes = []
                  playbackDestination = nil
                  isPlaying = false
              }

              func playC4() { playSequence([[60]]) }
              func playChord() { playSequence([[60, 64, 67]]) }
              func playPassage() { playSequence([[60], [64], [67], [72], [67], [64], [60]], duration: 0.35) }

              func playSequence(_ steps: [[UInt8]], duration: Double = 0.7) {
                  stopPlayback()
                  let local = localAudio
                  let dest = selectedDestination ?? MIDIGetDestination(0)
                  if local {
                      do { try configureAudio() }
                      catch { status = "Audio unavailable: \(error.localizedDescription)"; return }
                  } else {
                      guard MIDIGetNumberOfDestinations() > 0, destinationIDs.contains(dest) else { status = "MIDI destination unavailable"; return }
                      playbackDestination = dest
                  }
                  isPlaying = true
                  let generation = playbackGeneration
                  let delay = local ? 0 : visualDelay
                  func advance(_ index: Int) {
                      guard generation == self.playbackGeneration else { return }
                      guard index < steps.count else { self.stopPlayback(); return }
                      self.sounding = Set(steps[index])
                      let visualNotes = Set(steps[index].map(Int.init))
                      for note in self.sounding {
                          if local { self.sampler.startNote(note, withVelocity: 75, onChannel: 0) }
                          else { self.send(status: 0x90, note: note, velocity: 75, to: dest) }
                      }
                      DispatchQueue.main.asyncAfter(deadline: .now() + delay) { [weak self] in
                          guard let self, generation == self.playbackGeneration else { return }
                          self.playbackNotes = visualNotes
                          self.lastPlaybackNotes = visualNotes
                      }
                      DispatchQueue.main.asyncAfter(deadline: .now() + duration) { [weak self] in
                          guard let self, generation == self.playbackGeneration else { return }
                          for note in self.sounding {
                              if local { self.sampler.stopNote(note, onChannel: 0) }
                              else { self.send(status: 0x80, note: note, velocity: 0, to: dest) }
                          }
                          self.sounding.removeAll()
                          // Keep the just-played notes visible through the Disklavier's mechanical release.
                          // The next step replaces them; the final step remains as a playback result until
                          // the user plays the Yamaha or starts another playback.
                          if index + 1 < steps.count {
                              advance(index + 1)
                          } else {
                              self.playbackDestination = nil
                              DispatchQueue.main.asyncAfter(deadline: .now() + delay) { [weak self] in
                                  guard let self, generation == self.playbackGeneration else { return }
                                  self.playbackNotes = []
                                  self.lastPlaybackNotes = []
                                  self.isPlaying = false
                              }
                          }
                      }
                  }
                  advance(0)
              }

              private func send(status: UInt8, note: UInt8, velocity: UInt8, to dest: MIDIEndpointRef) {
                  var list = MIDIEventList()
                  let packet = MIDIEventListInit(&list, ._1_0)
                  var words = [0x20000000 | UInt32(status) << 16 | UInt32(note) << 8 | UInt32(velocity)]
                  words.withUnsafeBufferPointer { ptr in
                      _ = MIDIEventListAdd(&list, MemoryLayout<MIDIEventList>.size, packet, 0, 1, ptr.baseAddress!)
                  }
                  let result = MIDISendEventList(outputPort, dest, &list)
                  if status & 0xF0 == 0x90 {
                      self.status = "MIDI send: \(result) · \(self.name(dest))"
                  }
              }
          }
          SWIFT

          cat > PianoMentor/ContentView.swift <<'SWIFT'
          import SwiftUI
          import CoreMIDI
          import UniformTypeIdentifiers

          struct ContentView: View {
              @EnvironmentObject var midi: MIDIManager
              @AppStorage("chordOctave") private var chordOctave = 4
              @AppStorage("appearanceMode") private var appearanceMode = 0
              @AppStorage("keyHighlight") private var keyHighlight = 0
              @State private var settings = false
              @State private var musicLibrary = false
              @State private var importingMIDI = false
              @State private var importedSongs: [URL] = []
              @State private var importError = ""
              private var musicFolder: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0].appendingPathComponent("MIDI Library", isDirectory: true)
              }
              private func refreshSongs() {
                  importedSongs = ((try? FileManager.default.contentsOfDirectory(at: musicFolder, includingPropertiesForKeys: nil)) ?? []).filter { ["mid", "midi"].contains($0.pathExtension.lowercased()) }.sorted { $0.lastPathComponent < $1.lastPathComponent }
              }
              private func importSong(_ url: URL) throws {
                  let access = url.startAccessingSecurityScopedResource()
                  defer { if access { url.stopAccessingSecurityScopedResource() } }
                  let data = try Data(contentsOf: url)
                  guard data.count >= 14, data.prefix(4) == Data([77,84,104,100]) else {
                      throw NSError(domain: "PianoMentor", code: 1, userInfo: [NSLocalizedDescriptionKey: "Not a standard MIDI file"])
                  }
                  try FileManager.default.createDirectory(at: musicFolder, withIntermediateDirectories: true)
                  var target = musicFolder.appendingPathComponent(url.lastPathComponent)
                  if FileManager.default.fileExists(atPath: target.path) {
                      target = musicFolder.appendingPathComponent(UUID().uuidString + "-" + url.lastPathComponent)
                  }
                  try data.write(to: target, options: .atomic)
                  refreshSongs()
              }
              private var musicLibraryView: some View {
                  NavigationStack {
                      List {
                          Button("Import MIDI file") { importingMIDI = true }
                          if !importError.isEmpty { Text(importError).foregroundStyle(.red) }
                          ForEach(importedSongs, id: \.self) { song in
                              Text(song.deletingPathExtension().lastPathComponent)
                          }
                          Text("Imported files are stored on this device. Song playback and notation are not yet available.").font(.footnote).foregroundStyle(.secondary)
                      }
                      .navigationTitle("MIDI Music Library")
                      .toolbar { Button("Done") { musicLibrary = false } }
                      .onAppear { refreshSongs() }
                      .fileImporter(isPresented: $importingMIDI, allowedContentTypes: [.midi], allowsMultipleSelection: true) { result in
                          do {
                              importError = ""
                              for url in try result.get() { try importSong(url) }
                          } catch { importError = error.localizedDescription }
                      }
                  }
              }
              @State private var root = 0
              @State private var quality = 0
              @State private var inversion = 0
              @State private var voicing = 0
              @State private var arpeggio = false
              @State private var bpm = 90.0
              @State private var library = false
              private let roots = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"]
              private let shapes: [(String, [Int])] = [
                  ("Major",[0,4,7]), ("Minor",[0,3,7]), ("7",[0,4,7,10]),
                  ("maj7",[0,4,7,11]), ("m7",[0,3,7,10]), ("dim",[0,3,6]),
                  ("dim7",[0,3,6,9]), ("aug",[0,4,8]), ("sus2",[0,2,7]),
                  ("sus4",[0,5,7]), ("add9",[0,4,7,14]), ("6",[0,4,7,9]),
                  ("m7♭5",[0,3,6,10]), ("9",[0,4,7,10,14]), ("maj9",[0,4,7,11,14]),
                  ("m9",[0,3,7,10,14]), ("11",[0,4,7,10,14,17]),
                  ("maj11",[0,4,7,11,14,17]), ("m11",[0,3,7,10,14,17]),
                  ("13",[0,4,7,10,14,17,21]), ("maj13",[0,4,7,11,14,17,21]),
                  ("m13",[0,3,7,10,14,17,21]), ("7♭9",[0,4,7,10,13]),
                  ("7♯9",[0,4,7,10,15]), ("7♯11",[0,4,7,10,18])
              ]
              private var chordNotes: [UInt8] {
                  var notes = shapes[quality].1.map { 12 * (min(6, max(2, chordOctave)) + 1) + root + $0 }
                  if voicing == 2 && notes.count >= 4 { notes.removeFirst() }
                  for _ in 0..<min(inversion, notes.count - 1) {
                      var n = notes.removeFirst()
                      while n <= (notes.last ?? n) { n += 12 }
                      notes.append(n)
                  }
                  if voicing == 1 && notes.count > 2 { notes[1] += 12 }
                  while (notes.max() ?? 0) > 108 { notes = notes.map { $0 - 12 } }
                  return notes.sorted().map { UInt8($0) }
              }
              private var chordLibrary: some View {
                  NavigationStack {
                      Form {
                          Picker("Root", selection: $root) {
                              ForEach(roots.indices, id: \.self) { Text(roots[$0]).tag($0) }
                          }
                          Picker("Octave", selection: $chordOctave) {
                              ForEach(2...6, id: \.self) { Text("Octave \($0)").tag($0) }
                          }
                          Picker("Quality", selection: $quality) {
                              ForEach(shapes.indices, id: \.self) { Text(shapes[$0].0).tag($0) }
                          }
                          Picker("Inversion", selection: $inversion) {
                              ForEach(0..<shapes[quality].1.count, id: \.self) { Text($0 == 0 ? "Root position" : "Rotation \($0)").tag($0) }
                          }
                          Picker("Voicing", selection: $voicing) {
                              Text("Standard").tag(0)
                              Text("Open").tag(1)
                              Text("Omit root (7th and extended)").tag(2)
                          }
                          Toggle("Arpeggiate", isOn: $arpeggio)
                          Text("Tempo: \(Int(bpm)) BPM")
                          Slider(value: $bpm, in: 40...180, step: 1)
                          Text(chordNotes.map { noteName(Int($0)) }.joined(separator: " – "))
                          KeyboardView(activeNotes: Set(chordNotes.map(Int.init))).frame(height: 120)
                          Button("Play selected chord") {
                              midi.playSequence(arpeggio ? chordNotes.map { [$0] } : [chordNotes], duration: 60 / bpm)
                          }
                          Button("Stop", role: .destructive) { midi.stopPlayback() }
                      }
                      .navigationTitle("Chord Library")
                      .toolbar { Button("Done") { midi.stopPlayback(); library = false } }
                      .onChange(of: quality) { _, _ in inversion = 0 }
                  }
              }
              var body: some View {
                  VStack(spacing: 22) {
                      HStack {
                          VStack(alignment: .leading) {
                              Text("PianoMentor").font(.largeTitle.bold())
                              Text("Disklavier ENSPIRE · Hardware Test").foregroundStyle(.secondary)
                          }
                          Spacer()
                          Text(midi.status).padding(.horizontal, 14).padding(.vertical, 8).background(.thinMaterial).clipShape(Capsule())
                      }
                      .padding(.horizontal)

                      Spacer()
                      let shownNotes = midi.activeNotes.isEmpty ? midi.playbackNotes : midi.activeNotes
                      if let chord = chordName(shownNotes) {
                          Text(chord).font(.title.bold())
                      }
                      Text(shownNotes.isEmpty ? "—" : shownNotes.sorted().map { noteName($0) }.joined(separator: " – ")).font(.system(size: 42, weight: .bold, design: .rounded))
                      Text(midi.lastNote == nil ? "Play a key on the Yamaha" : "MIDI note \(midi.lastNote!) · velocity \(midi.lastVelocity)")
                          .font(.title3).foregroundStyle(.secondary)

                      KeyboardView(activeNotes: midi.activeNotes.union(midi.playbackNotes))
                          .frame(height: 190).padding(.horizontal)

                      Button { midi.playC4() } label: {
                          Label(midi.localAudio ? "Play C4 locally" : "Play C4 on Yamaha", systemImage: "pianokeys")
                              .font(.title2.bold()).frame(maxWidth: 420).padding()
                      }.buttonStyle(.borderedProminent)

                      HStack {
                          Button("Settings") { settings = true }
                          Button("Chord Library") { library = true }
                          Button("MIDI Library") { musicLibrary = true }
                          Button("Play C major chord") { midi.playChord() }
                          Button("Play short passage") { midi.playPassage() }
                          Button("Stop", role: .destructive) { midi.stopPlayback() }
                      }.buttonStyle(.bordered)

                      HStack {
                          Text("Visual delay: \(Int(midi.visualDelay * 1000)) ms").font(.caption)
                          Slider(value: $midi.visualDelay, in: 0...0.8, step: 0.025)
                      }.padding(.horizontal)
                      HStack(spacing: 28) {
                          VStack(alignment: .leading) {
                              Text("INPUT").font(.caption.bold()).foregroundStyle(.secondary)
                              Text(midi.sources.isEmpty ? "None" : midi.sources.joined(separator: ", "))
                          }
                          VStack(alignment: .leading) {
                              Text("OUTPUT").font(.caption.bold()).foregroundStyle(.secondary)
                              Picker("MIDI output", selection: Binding(get: { midi.selectedDestination }, set: { midi.selectDestination($0) })) {
                                      Text("Automatic").tag(Optional<MIDIEndpointRef>.none)
                                      ForEach(Array(midi.destinationIDs.enumerated()), id: \.element) { index, endpoint in
                                          Text(index < midi.destinations.count ? midi.destinations[index] : "MIDI Device").tag(Optional(endpoint))
                                      }
                                  }
                          }
                          Button("Refresh MIDI") { midi.refresh() }
                      }.font(.footnote).padding(.bottom)
                  }
                  .padding()
                  .sheet(isPresented: $library) { chordLibrary }
                  .sheet(isPresented: $musicLibrary) { musicLibraryView }
                  .sheet(isPresented: $settings) {
                      NavigationStack {
                          Form {
                              Toggle("Internal audio (experimental)", isOn: Binding(get: { midi.localAudio }, set: { midi.setLocalAudio($0) }))
                              Picker("Appearance", selection: $appearanceMode) {
                                  Text("System").tag(0)
                                  Text("Light").tag(1)
                                  Text("Dark").tag(2)
                              }
                              Picker("Key highlight", selection: $keyHighlight) {
                                  Text("Blue").tag(0)
                                  Text("Green").tag(1)
                                  Text("Orange").tag(2)
                                  Text("Purple").tag(3)
                                  Text("Red").tag(4)
                                  Text("Teal").tag(5)
                              }
                          }.navigationTitle("Settings").toolbar { Button("Done") { settings = false } }
                      }
                  }
                  .preferredColorScheme(appearanceMode == 1 ? .light : appearanceMode == 2 ? .dark : nil)
                  .tint([Color.blue, .green, .orange, .purple, .red, .teal][min(5, max(0, keyHighlight))])
                  .onDisappear { midi.stopPlayback() }
              }

              private func chordName(_ notes: Set<Int>) -> String? {
                  guard notes.count >= 3 else { return nil }
                  let pcs = Set(notes.map { $0 % 12 })
                  let names = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"]
                  let patterns: [(Set<Int>, String)] = [
                      ([0,4,7], "major"), ([0,3,7], "minor"),
                      ([0,3,6], "diminished"), ([0,4,8], "augmented"),
                      ([0,5,7], "sus4"), ([0,2,7], "sus2"),
                      ([0,4,7,10], "7"), ([0,4,7,11], "maj7"),
                      ([0,3,7,10], "m7"),
                      ([0,4,7,11,2], "maj9"), ([0,4,7,11,2,5], "maj11"),
                      ([0,4,7,11,2,5,9], "maj13"), ([0,4,7,10,2], "9"),
                      ([0,4,7,10,2,5], "11"), ([0,4,7,10,2,5,9], "13"),
                      ([0,3,7,10,2], "m9"), ([0,3,7,10,2,5], "m11"),
                      ([0,3,7,10,2,5,9], "m13"), ([0,3,6,9], "dim7"),
                      ([0,3,6,10], "m7♭5"), ([0,4,7,2], "add9")
                  ]
                  for root in 0..<12 {
                      let relative = Set(pcs.map { ($0 - root + 12) % 12 })
                      for (pattern, quality) in patterns where relative == pattern {
                          if quality == "major" { return "\(names[root]) major" }
                          if quality == "minor" { return "\(names[root]) minor" }
                          if quality == "m7" { return "\(names[root]) minor 7" }
                          return "\(names[root]) \(quality)"
                      }
                  }
                  return nil
              }

              private func noteName(_ n: Int?) -> String {
                  guard let n else { return "—" }
                  let names = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"]
                  return "\(names[n % 12])\(n / 12 - 1)"
              }
          }

          struct KeyboardView: View {
              let activeNotes: Set<Int>
              @AppStorage("keyHighlight") private var keyHighlight = 0
              private var highlight: Color { [Color.blue, .green, .orange, .purple, .red, .teal][min(5, max(0, keyHighlight))] }
              private let start = 21, end = 108
              private let black = Set([1,3,6,8,10])
              var body: some View {
                  GeometryReader { geo in
                      let whites = (start...end).filter { !black.contains($0 % 12) }
                      let w = geo.size.width / CGFloat(whites.count)
                      ZStack(alignment: .topLeading) {
                          HStack(spacing: 0) {
                              ForEach(whites, id: \.self) { n in
                                  Rectangle().fill(activeNotes.contains(n) ? highlight.opacity(0.55) : Color.white)
                                      .overlay(Rectangle().stroke(Color.black, lineWidth: 0.5))
                                      .overlay(alignment: .bottom) {
                                          if n % 12 == 0 || n == 21 {
                                              Text(n == 21 ? "A0" : "C\(n / 12 - 1)")
                                                  .font(.system(size: min(10, w * 0.65)))
                                                  .foregroundStyle(Color.black).padding(.bottom, 5)
                                          }
                                      }
                              }
                          }
                          ForEach(start...end, id: \.self) { n in
                              if black.contains(n % 12), let wi = whiteIndex(before: n, whites: whites) {
                                  Rectangle().fill(activeNotes.contains(n) ? highlight : Color.black)
                                      .frame(width: w * 0.62, height: geo.size.height * 0.62)
                                      .offset(x: CGFloat(wi + 1) * w - w * 0.31)
                              }
                          }
                      }.clipShape(RoundedRectangle(cornerRadius: 8))
                  }
              }
              private func whiteIndex(before n: Int, whites: [Int]) -> Int? { whites.lastIndex(where: { $0 < n }) }
          }
          SWIFT

      - name: Generate Xcode project
        script: |
          set -e
          brew install xcodegen || true
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project PianoMentor.xcodeproj --scheme PianoMentor
      - name: Verify packaged launch screen
        script: |
          set -e
          python3 - <<'PY'
          import glob, zipfile, plistlib
          ipa = glob.glob('build/ios/ipa/*.ipa')[0]
          with zipfile.ZipFile(ipa) as z:
              p = next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/') == 2)
              info = plistlib.loads(z.read(p))
              keys = ['UILaunchScreen', 'UILaunchScreens', 'UILaunchStoryboardName', 'UILaunchStoryboards']
              assert any(k in info for k in keys), 'Missing launch screen in packaged Info.plist'
              import os
              expected = str(int(os.environ['BUILD_NUMBER']) + 1)
              assert info.get('CFBundleVersion') == expected, f"Unexpected packaged build number: {info.get('CFBundleVersion')}, expected {expected}"
              assert info.get('ITSAppUsesNonExemptEncryption') is False, 'Missing or incorrect encryption declaration'
              print('Build number verified:', expected)
              print('Launch screen verified:', [k for k in keys if k in info])
          PY
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
