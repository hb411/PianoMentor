          // Pitch-only grand staff, not a rhythmic score.
          struct LivePitchStaff: View {
              let notes: Set<Int>
              private func step(_ note: Int) -> Int {
                  (note / 12 - 1) * 7 + [0,0,1,1,2,3,3,4,4,5,5,6][note % 12]
              }
              var body: some View {
                  Canvas { context, size in
                      let visible = notes.sorted().filter { (21...108).contains($0) }
                      let low = min(16, visible.map { step($0) }.min() ?? 16)
                      let high = max(40, visible.map { step($0) }.max() ?? 40)
                      let spacing = size.height / CGFloat(high - low + 4)
                      func y(_ degree: Int) -> CGFloat { CGFloat(high - degree + 2) * spacing }
                      func line(_ x1: CGFloat, _ x2: CGFloat, _ degree: Int) {
                          var path = Path()
                          path.move(to: CGPoint(x: x1, y: y(degree)))
                          path.addLine(to: CGPoint(x: x2, y: y(degree)))
                          context.stroke(path, with: .foreground, lineWidth: 1)
                      }
                      for degree in [18,20,22,24,26,30,32,34,36,38] {
                          line(28, size.width - 8, degree)
                      }
                      context.draw(Text("𝄞").font(.system(size: 27)), at: CGPoint(x: 15, y: y(34)))
                      context.draw(Text("𝄢").font(.system(size: 27)), at: CGPoint(x: 15, y: y(22)))
                      for (index, note) in visible.enumerated() {
                          let degree = step(note)
                          let x = 48 + CGFloat(index) * max(1, (size.width - 65) / CGFloat(max(1, visible.count)))
                          if degree == 28 { line(x - 9, x + 9, degree) }
                          if degree <= 16 {
                              for ledger in stride(from: 16, through: degree, by: -2) { line(x - 9, x + 9, ledger) }
                          }
                          if degree >= 40 {
                              for ledger in stride(from: 40, through: degree, by: 2) { line(x - 9, x + 9, ledger) }
                          }
                          let rect = CGRect(x: x - 5, y: y(degree) - 3.5, width: 10, height: 7)
                          context.fill(Path(ellipseIn: rect), with: .foreground)
                          if [1,3,6,8,10].contains(note % 12) {
                              context.draw(Text("♯").font(.system(size: 12)), at: CGPoint(x: x - 11, y: y(degree)))
                          }
                      }
                  }
                  .accessibilityLabel("Live pitch staff, full piano range")
              }
          }

          struct KeyboardView: View {
              let activeNotes: Set<Int>
              var onDown: ((Int) -> Void)? = nil
              var onUp: ((Int) -> Void)? = nil
              @AppStorage("keyHighlight") private var keyHighlight = 0
              private var highlight: Color { [Color.blue, .green, .orange, .purple, .red, .teal][min(5, max(0, keyHighlight))] }
              @AppStorage("keyboardOctaves") private var keyboardOctaves = 0
              @AppStorage("keyboardStartOctave") private var keyboardStartOctave = 3
              private var span: Int { [2,3,4].contains(keyboardOctaves) ? keyboardOctaves : 0 }
              private var start: Int { span == 0 ? 21 : 12 * (min(8 - span, max(1, keyboardStartOctave)) + 1) }
              private var end: Int { span == 0 ? 108 : min(108, start + span * 12 - 1) }
              private let black = Set([1,3,6,8,10])
              var body: some View {
                  GeometryReader { geo in
                      let whites = (start...end).filter { !black.contains($0 % 12) }
                      let w = geo.size.width / CGFloat(whites.count)
                      ZStack(alignment: .topLeading) {
                          HStack(spacing: 0) {
                              ForEach(whites, id: \.self) { n in
                                  Rectangle().fill(activeNotes.contains(n) ? highlight.opacity(0.55) : Color.white)
                                      .overlay(Rectangle().stroke(Color.black, lineWidth: 0.5))
                                      .overlay(alignment: .bottom) {
                                          if n % 12 == 0 || n == 21 {
                                              Text(n == 21 ? "A0" : "C\(n / 12 - 1)")
                                                  .font(.system(size: min(10, w * 0.65)))
                                                  .foregroundStyle(Color.black).padding(.bottom, 5)
                                          }
                                      }
                              }
                          }
                          ForEach(start...end, id: \.self) { n in
                              if black.contains(n % 12), let wi = whiteIndex(before: n, whites: whites) {
                                  Rectangle().fill(activeNotes.contains(n) ? highlight : Color.black)
                                      .frame(width: w * 0.62, height: geo.size.height * 0.62)
                                      .offset(x: CGFloat(wi + 1) * w - w * 0.31)
                              }
                          }
                          if let onDown, let onUp {
                              PianoTouchSurface(whites: whites, blackNotes: (start...end).filter { black.contains($0 % 12) }, down: onDown, up: onUp)
                          }
                      }.clipShape(RoundedRectangle(cornerRadius: 8))
                  }
              }
              private func whiteIndex(before n: Int, whites: [Int]) -> Int? { whites.lastIndex(where: { $0 < n }) }
          }
          SWIFT

      - name: Generate Xcode project
        script: |
          set -e
          brew install xcodegen || true
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project PianoMentor.xcodeproj --scheme PianoMentor
      - name: Verify packaged launch screen
        script: |
          set -e
          python3 - <<'PY'
          import glob, zipfile, plistlib
          ipa = glob.glob('build/ios/ipa/*.ipa')[0]
          with zipfile.ZipFile(ipa) as z:
              p = next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/') == 2)
              info = plistlib.loads(z.read(p))
              keys = ['UILaunchScreen', 'UILaunchScreens', 'UILaunchStoryboardName', 'UILaunchStoryboards']
              assert any(k in info for k in keys), 'Missing launch screen in packaged Info.plist'
              import os
              expected = str(int(os.environ['BUILD_NUMBER']) + 1)
              assert info.get('CFBundleVersion') == expected, f"Unexpected packaged build number: {info.get('CFBundleVersion')}, expected {expected}"
              assert info.get('ITSAppUsesNonExemptEncryption') is False, 'Missing or incorrect encryption declaration'
              print('Build number verified:', expected)
              print('Launch screen verified:', [k for k in keys if k in info])
          PY
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
